<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, viewport-fit=cover">
    <title>System Alert - BELTON IPQC</title>
    <script src="api.js"></script>
    <script src="global_nav.js"></script>
    <style>
        :root {
            --primary: #CC1033;
            --primary-dark: #a50d28;
            --primary-light: #fff0f2;
            --pass: #10b981;
            --pass-bg: #d1fae5;
            --fail: #ef4444;
            --fail-bg: #fee2e2;
            --warn: #f59e0b;
            --warn-bg: #fef3c7;
            --bg-main: #fff5f6;
            --bg-card: #ffffff;
            --text-main: #1a0608;
            --text-muted: #7a4a50;
            --border: #f5cdd2;
            --sidebar-w: 260px;
            --topbar-h: 64px;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Calibri', 'Candara', 'Segoe UI', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            height: var(--topbar-h);
            background: var(--bg-card);
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
        }

        .content {
            padding: 24px 28px;
            flex: 1;
        }

        /* KPI Row */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .kpi-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .kpi-icon svg { width: 24px; height: 24px; }
        .kpi-icon.total { background: var(--primary-light); stroke: var(--primary); }
        .kpi-icon.fail { background: var(--fail-bg); stroke: var(--fail); }
        .kpi-icon.warn { background: var(--warn-bg); stroke: var(--warn); }
        .kpi-icon.dispensing { background: #ffe0e4; stroke: #CC1033; }

        .kpi-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .kpi-value {
            font-size: 26px;
            font-weight: 700;
            line-height: 1;
        }

        /* Card / Table */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .filter-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .select-input, .date-input {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        
        .btn-danger { background: var(--fail-bg); color: var(--fail); }
        .btn-danger:hover { background: #fca5a5; }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 800px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
            white-space: nowrap;
        }

        tbody tr:hover { background: var(--primary-light); }

        .pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .pill.ng { background: var(--fail-bg); color: var(--fail); }
        .pill.warning { background: var(--warn-bg); color: var(--warn); }
        .pill.critical { background: var(--fail-bg); color: var(--fail); }
        .pill.info { background: #e0f2fe; color: #0284c7; }

        .module-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .tag-dispensing { background: #ffe0e4; color: #CC1033; }
        .tag-laser { background: #ffd6da; color: #a50d28; }
        .tag-pof { background: #ffebec; color: #e8555e; }
        .tag-damper { background: #ffc8cd; color: #8a0020; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        @media (max-width: 767px) {
            .main { margin-left: 0; }
            .kpi-row { grid-template-columns: 1fr 1fr; }
            .filter-row { flex-wrap: wrap; }
        }
    </style>
</head>

<body>
    <aside id="sidebar-root"></aside>

    <main class="main">
        <header class="topbar">
            <div class="topbar-title">System Alert Center</div>
            <div class="topbar-right">
                <span style="color:var(--text-muted); font-size:13px;">Administrator</span>
            </div>
        </header>

        <div class="content">
            <div class="kpi-row">
                <div class="kpi-card">
                    <div class="kpi-icon total">
                        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                    </div>
                    <div>
                        <div class="kpi-label">Total Alerts</div>
                        <div class="kpi-value" id="kpi-total">0</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon fail">
                        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                    </div>
                    <div>
                        <div class="kpi-label">Critical / NG</div>
                        <div class="kpi-value" id="kpi-critical" style="color:var(--fail)">0</div>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon warn">
                        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </div>
                    <div>
                        <div class="kpi-label">Warning</div>
                        <div class="kpi-value" id="kpi-warning" style="color:var(--warn)">0</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">Alert Details</div>
                    <div class="filter-row">
                        <select class="select-input" id="filter-module">
                            <option value="">All Modules</option>
                            <option value="dispensing">Dispensing</option>
                            <option value="laser">Laser Engraving</option>
                            <option value="pof">Push Out Force</option>
                            <option value="damper">Damper Install</option>
                        </select>
                        <select class="select-input" id="filter-level">
                            <option value="">All Levels</option>
                            <option value="NG">NG / Critical</option>
                            <option value="Warning">Warning</option>
                        </select>
                        <button class="btn btn-primary" onclick="loadAlerts()">Filter</button>
                        <button class="btn btn-danger" onclick="clearAlerts()">Clear Displayed</button>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Module</th>
                                <th>Level</th>
                                <th>Product / Fixture</th>
                                <th>Traveler / Oven</th>
                                <th>Parameter</th>
                                <th>Message</th>
                            </tr>
                        </thead>
                        <tbody id="alerts-tbody">
                            <tr><td colspan="7" class="empty-state">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="system_alert.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initGlobalNavigation('system-alert');
            loadAlerts();
        });
    </script>
</body>
</html>
